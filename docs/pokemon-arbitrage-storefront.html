<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokemon Card Deal Desk</title>
  <style>
    :root { color-scheme: dark; --bg:#09090b; --panel:#0f0f12; --panel2:#18181b; --line:#27272a; --ink:#fafafa; --muted:#a1a1aa; --green:#86efac; --blue:#93c5fd; --rose:#fb7185; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at 10% 0%, rgba(147,197,253,.16), transparent 30rem), var(--bg); color:var(--ink); font-family:Inter,system-ui,sans-serif; }
    main { width:min(1280px, calc(100vw - 32px)); margin:0 auto; padding:24px 0 44px; }
    header { display:flex; justify-content:space-between; gap:16px; align-items:end; border-bottom:1px solid var(--line); padding-bottom:18px; flex-wrap:wrap; }
    h1 { margin:0; font-size:clamp(32px,5vw,58px); line-height:1; }
    p { color:var(--muted); line-height:1.55; }
    button,input,textarea { font:inherit; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--ink); padding:10px 12px; }
    button { cursor:pointer; font-weight:700; }
    .primary { background:var(--ink); color:var(--bg); }
    .grid { display:grid; grid-template-columns:1fr 380px; gap:14px; margin-top:16px; }
    .panel,.card { border:1px solid var(--line); border-radius:8px; background:var(--panel); }
    .panel h2 { margin:0; padding:14px; border-bottom:1px solid var(--line); color:var(--muted); font-size:14px; }
    .list { display:grid; gap:10px; padding:12px; }
    .card { padding:14px; }
    .card h3 { margin:0 0 8px; }
    .meta { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
    .pill { border:1px solid var(--line); border-radius:999px; padding:3px 8px; color:var(--muted); font-size:12px; }
    .profit { color:var(--green); font-weight:800; }
    form { display:grid; gap:10px; padding:12px; }
    input,textarea { width:100%; }
    .note { border:1px solid var(--line); border-radius:8px; padding:12px; background:var(--panel2); }
    @media (max-width: 900px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p>Pokemon Arbitrage · Approval-gated Storefront</p>
        <h1>Pokemon Card Deal Desk</h1>
        <p>所有商品屬預訂 / sourcing request，需確認來源仍有貨、狀態真確及最終價格後才成立。</p>
      </div>
      <button id="refresh" class="primary">Load approved deals</button>
    </header>

    <section class="grid">
      <div class="panel">
        <h2>Approved Deals</h2>
        <div id="deals" class="list"></div>
      </div>
      <aside class="panel">
        <h2>Order Request</h2>
        <form id="orderForm">
          <input id="opportunityId" placeholder="Deal ID" required>
          <input id="buyerName" placeholder="Your name" required>
          <input id="buyerContact" placeholder="WhatsApp / email" required>
          <textarea id="message" rows="5" placeholder="Message / preferred meetup / questions"></textarea>
          <button class="primary">Submit request</button>
          <div class="note">不會自動收款。提交後店主會先確認來源商品仍可買、真假/品相/價格，再回覆你。</div>
        </form>
      </aside>
    </section>
  </main>

  <script>
    const apiBase = "http://127.0.0.1:8787";
    const dealsEl = document.querySelector("#deals");
    document.querySelector("#refresh").addEventListener("click", loadDeals);
    document.querySelector("#orderForm").addEventListener("submit", submitOrder);
    loadDeals();

    async function loadDeals() {
      try {
        const response = await fetch(`${apiBase}/api/storefront`);
        if (!response.ok) throw new Error(`API ${response.status}`);
        const deals = await response.json();
        dealsEl.innerHTML = deals.length ? deals.map(renderDeal).join("") : `<div class="card"><p>No approved deals yet. Approve opportunities in backend first.</p></div>`;
      } catch (error) {
        dealsEl.innerHTML = `<div class="card"><h3>Backend not connected</h3><p>Start backend first: <code>python app.py</code><br>${escapeHtml(error.message)}</p></div>`;
      }
    }

    function renderDeal(item) {
      return `
        <article class="card">
          <h3>${escapeHtml(item.title)}</h3>
          <div class="meta">
            <span class="pill">ID ${item.id}</span>
            <span class="pill">${escapeHtml(item.source_name)}</span>
            <span class="pill">Ask HK$${num(item.asking_price_hkd)}</span>
            <span class="pill">Target HK$${num(item.target_resale_hkd)}</span>
            <span class="pill profit">+HK$${num(item.estimated_profit_hkd)} / ${Math.round(item.estimated_margin_pct)}%</span>
          </div>
          <p>${escapeHtml(item.condition_note || "")}</p>
          <p>${escapeHtml(item.risk_note || "")}</p>
          <p><a href="${item.source_url}" target="_blank" rel="noreferrer" style="color:var(--blue)">Source link</a></p>
        </article>
      `;
    }

    async function submitOrder(event) {
      event.preventDefault();
      const payload = {
        opportunity_id: Number(document.querySelector("#opportunityId").value),
        buyer_name: document.querySelector("#buyerName").value,
        buyer_contact: document.querySelector("#buyerContact").value,
        message: document.querySelector("#message").value,
        quantity: 1
      };
      const response = await fetch(`${apiBase}/api/orders`, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(payload) });
      const result = await response.json();
      alert(result.ok ? `Order request received: #${result.order_id}` : JSON.stringify(result));
    }

    function num(value) { return Number(value || 0).toLocaleString(); }
    function escapeHtml(value) { return String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;"); }
  </script>
</body>
</html>
